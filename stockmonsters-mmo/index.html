<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Stockmonsters</title>
    <meta
      name="viewport"
      content="initial-scale=1, maximum-scale=1, user-scalable=no, minimum-scale=1, width=device-width, height=device-height"
    />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./node_modules/@rpgjs/ui-css/src/reset.css">
    <link rel="stylesheet" href="./node_modules/@rpgjs/ui-css/src/index.css">
    <link rel="stylesheet" href="./node_modules/@rpgjs/ui-css/theme-pixel/theme.css">
    <style>
      /* Dialogs as centered pixel-art game windows (theme-pixel palette).
         The engine's own container supports positions; we force the centered
         one everywhere and size the box like a classic RPG window. */
      .rpg-ui-dialog-container { align-items: center !important; }
      .rpg-ui-dialog {
        width: min(600px, 92vw) !important;
        min-height: 0 !important;
        --rpg-ui-dialog-min-height: 0px;
        --rpg-ui-dialog-padding: 20px;
        image-rendering: pixelated;
      }
      .rpg-ui-dialog-body { font-size: 15px; line-height: 1.7; }
      .rpg-ui-dialog-content, .rpg-ui-dialog-body { min-height: 0 !important; }
      .rpg-ui-close-button {
        top: 12px !important;
        right: 12px !important;
        left: auto !important;
        width: 34px; height: 34px;
        border-radius: 0 !important;
        border: 3px solid var(--rpg-ui-border) !important;
        background: var(--rpg-ui-surface) !important;
        color: var(--rpg-ui-text) !important;
        box-shadow: 3px 3px 0 #09070f !important;
        font-family: var(--rpg-ui-font) !important;
      }
      body, #rpg {
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        background: #000;
      }
      /* --- Title screen ------------------------------------------------- */
      #title-screen {
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: #060913;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity .8s ease;
      }
      #title-screen.hidden { opacity: 0; pointer-events: none; }
      /* The art is the 1672x941 widescreen title (roughly 16:9, so it fills a
         normal monitor instead of leaving pillarboxes down both sides).
         Wrapping it in an element that shrink-wraps to the same aspect lets the
         buttons be positioned as a PERCENTAGE of the artwork, so they sit in
         the same spot on the picture at every window size. */
      #title-stage {
        position: relative;
        aspect-ratio: 1672 / 941;
        width: min(100vw, calc(100vh * 1672 / 941));
        height: auto;
        max-height: 100vh;
      }
      #title-stage img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        user-select: none;
        -webkit-user-drag: none;
      }
      /* The buttons. This art has no PRESS START plate baked into it, so the
         panel is placed rather than fitted: under the logo, clear of the WALL
         ST sign on the left and of the character on the right, over the plain
         part of the skyline. */
      #title-actions {
        position: absolute;
        left: 17.5%;
        top: 52.0%;
        width: 31.0%;
        min-height: 10.5%;
        display: flex;
        flex-direction: column;
        background: #26213a;
        border: 3px solid #f6c177;
        box-shadow: 5px 5px 0 #09070f;
        overflow: hidden;
      }
      .title-btn {
        display: block;
        flex: 1 1 auto;
        width: 100%;
        padding: 3.4% 4%;
        font-family: "Courier New", ui-monospace, monospace;
        font-weight: 700;
        font-size: clamp(11px, 1.55vw, 20px);
        letter-spacing: .08em;
        color: #fff1c7;
        background: #26213a;
        border: 0;
        border-radius: 0;
        cursor: pointer;
        image-rendering: pixelated;
        text-align: center;
        white-space: nowrap;
      }
      .title-btn + .title-btn { border-top: 3px solid #f6c177; }
      /* .title-btn sets display:block, which outranks the UA rule for
         [hidden] — without this the button shows even when hidden. */
      .title-btn[hidden] { display: none; }
      .title-btn:hover { background: #322a4d; }
      .title-btn:active { filter: brightness(.85); }
      .title-btn.primary {
        background: #7ecf6b;
        color: #09070f;
      }
      .title-btn.primary:hover { background: #93dd80; }
      .title-btn.secondary {
        font-size: clamp(9px, 1.15vw, 15px);
        padding: 2.4% 4%;
      }
      #title-wallet-line {
        flex: 0 0 auto;
        padding: 1.4% 0;
        text-align: center;
        font-family: "Courier New", ui-monospace, monospace;
        font-size: clamp(9px, 1.05vw, 13px);
        letter-spacing: .06em;
        color: #7ecf6b;
        background: #1b1730;
      }
      #title-wallet-line:empty { display: none; }
      #title-screen .fade-in {
        position: absolute; inset: 0; background: #000;
        animation: fadein 1.6s ease forwards;
        pointer-events: none;
        z-index: 3;
      }
      @keyframes fadein { to { opacity: 0; } }
      /* --- Create Your Character ---------------------------------------- */
      #char-screen {
        position: fixed;
        inset: 0;
        z-index: 1001;
        background: rgba(9, 7, 15, .88);
        display: none;
        align-items: center;
        justify-content: center;
      }
      #char-screen.open { display: flex; }
      #char-screen .panel {
        width: min(640px, 94vw);
        max-height: 88vh;
        display: flex;
        flex-direction: column;
        background: #26213a;
        border: 4px solid #f6c177;
        box-shadow: 6px 6px 0 #09070f;
        image-rendering: pixelated;
      }
      #char-screen h1 {
        margin: 0;
        padding: 14px 20px;
        font-family: "Fredoka", "Trebuchet MS", sans-serif;
        font-weight: 600;
        letter-spacing: .14em;
        font-size: clamp(15px, 2.4vw, 20px);
        color: #fff1c7;
        text-shadow: 2px 2px 0 #09070f;
        border-bottom: 3px solid #f6c177;
        text-align: center;
      }
      #char-grid {
        flex: 1;
        overflow-y: auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
        gap: 10px;
        padding: 16px;
        scrollbar-width: thin;
      }
      .char-cell {
        position: relative;
        height: 76px;
        background: #1b1730;
        border: 3px solid #4a4368;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .char-cell:hover { border-color: #fff1c7; }
      .char-cell.selected { border-color: #7ecf6b; box-shadow: 0 0 0 1px #7ecf6b inset; }
      /* one 32x32 idle-facing-down frame (col 1, row 0), scaled 2x */
      .char-cell > i {
        width: 32px; height: 32px;
        background-repeat: no-repeat;
        background-position: -32px 0;
        transform: scale(2);
        image-rendering: pixelated;
        pointer-events: none;
      }
      #char-screen .footer {
        display: flex;
        justify-content: center;
        gap: 12px;
        padding: 14px;
        border-top: 3px solid #f6c177;
      }
      #char-confirm {
        padding: 10px 22px;
        font-family: "Courier New", ui-monospace, monospace;
        font-weight: 700;
        font-size: 14px;
        letter-spacing: .08em;
        color: #09070f;
        background: #7ecf6b;
        border: 3px solid #f6c177;
        border-radius: 0;
        box-shadow: 3px 3px 0 #09070f;
        cursor: pointer;
        image-rendering: pixelated;
      }
      #char-confirm:disabled { opacity: .4; cursor: default; }
      #char-confirm:not(:disabled):active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #09070f; }
    </style>
  </head>
  <body>
    <div id="rpg"></div>
    <div id="title-screen">
      <div id="title-stage">
        <img src="/titles/wide-bg.png" alt="Stockmonsters">
        <div id="title-actions">
          <button id="btn-primary" class="title-btn primary">CONNECT WALLET</button>
          <button id="btn-character" class="title-btn secondary" hidden>CHANGE YOUR CHARACTER</button>
          <button id="btn-nfts" class="title-btn secondary" hidden>MY STOCKMONSTERS / NFTS</button>
          <button id="btn-settings" class="title-btn secondary" hidden>GAME SETTINGS</button>
          <div id="title-wallet-line"></div>
        </div>
      </div>
      <div class="fade-in"></div>
    </div>
    <div id="char-screen">
      <div class="panel">
        <h1>CREATE YOUR CHARACTER</h1>
        <div id="char-grid"></div>
        <div class="footer">
          <button id="char-confirm" disabled>CONFIRM</button>
        </div>
      </div>
    </div>
    <!-- Which chain the wallet must be on. Loaded before the inline script
         below because the title screen's connect() needs it, and the bundled
         game UI reads the same global through src/chain-guard.ts. -->
    <script src="/chain-guard.js"></script>
    <script>
      // Classic RPG dialog feel: click the window (or Space/Enter) to
      // advance text. The engine only resolves showText via its close
      // button, so we forward to it — except when the click is a choice.
      document.addEventListener("click", function (e) {
        var dialog = e.target && e.target.closest && e.target.closest(".rpg-ui-dialog");
        if (!dialog) return;
        if (e.target.closest(".rpg-ui-dialog-choice, .rpg-ui-dialog-choices, button")) return;
        var x = document.querySelector(".rpg-ui-close-button");
        if (x) x.click();
      }, true); // capture: the GUI stops propagation on the bubble phase
      window.addEventListener("keydown", function (e) {
        if (e.key !== " " && e.key !== "Enter") return;
        var dialog = document.querySelector(".rpg-ui-dialog");
        if (!dialog || dialog.querySelector(".rpg-ui-dialog-choice")) return;
        var x = document.querySelector(".rpg-ui-close-button");
        if (x) { e.preventDefault(); x.click(); }
      });
      // ---------------------------------------------------------------
      // Title screen flow
      //
      //   not connected  ->  [CONNECT WALLET]
      //   connected      ->  [PLAY GAME]  +  [CHANGE YOUR CHARACTER]
      //
      // The wallet signs a server-issued nonce; the server verifies it and
      // returns an opaque connection identity (auth.mjs). A first-time player
      // is sent through the character picker before the world appears.
      // ---------------------------------------------------------------
      (function () {
        var screen = document.getElementById("title-screen");
        var primary = document.getElementById("btn-primary");
        var charBtn = document.getElementById("btn-character");
        var nftBtn = document.getElementById("btn-nfts");
        var settingsBtn = document.getElementById("btn-settings");
        var walletLine = document.getElementById("title-wallet-line");
        var picker = document.getElementById("char-screen");
        var grid = document.getElementById("char-grid");
        var confirmBtn = document.getElementById("char-confirm");
        var selectedId = null;
        var started = false;

        function short(a) { return a.slice(0, 6) + "\u2026" + a.slice(-4); }
        function readJson(key) {
          try { return JSON.parse(localStorage.getItem(key) || "null"); } catch (e) { return null; }
        }
        function wallet() {
          var w = readJson("sm-wallet");
          return w && w.connectionId ? w : null;
        }
        function savedCharacter() {
          var ids = readJson("sm-character");
          if (!Array.isArray(ids) || !ids.length) return null;
          var ok = ids.every(function (id) {
            // A built character's layers are prefixed "chl-", a ready-made is
            // "ch-". Matching only "ch-" meant a character you designed yourself
            // was never recognised as saved, so the picker reopened every time.
            return typeof id === "string" &&
              (id === "hero" || id === "female" ||
                id.indexOf("ch-") === 0 || id.indexOf("chl-") === 0);
          });
          return ok ? ids : null;
        }

        // Coming back from "Save & quit": the character is known, so PLAY GAME
        // must not bounce the player through the picker again.
        function savedName() {
          try {
            var n = localStorage.getItem("sm-name");
            return n && n.trim() ? n.trim() : "";
          } catch (e) { return ""; }
        }

        var returned = false;
        try {
          returned = sessionStorage.getItem("sm-returned-to-title") === "1";
          if (returned) sessionStorage.removeItem("sm-returned-to-title");
        } catch (e) {}

        // What to tell someone who has not connected yet. This was being
        // called before it existed, so render() threw for every disconnected
        // player and the line under the button was always blank — including
        // the one case it matters, a phone browser with no wallet in it.
        function walletHint() {
          if (window.ethereum) return "";
          var mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
          return mobile
            ? "No wallet here. Open this page inside your wallet's browser to play."
            : "No browser wallet found. Install one, then reload.";
        }

        function render() {
          var w = wallet();
          var connected = !!w;
          primary.textContent = connected ? "PLAY GAME" : "CONNECT WALLET";
          // Everything past connecting only makes sense with a wallet.
          charBtn.hidden = !connected;
          nftBtn.hidden = !connected;
          settingsBtn.hidden = !connected;
          // Greet a player the game already knows by name. The name is
          // repaired from the server on every login (chat-ui.ts writes it
          // back), so this is the same name their character carries in world,
          // not a stale browser guess.
          var hint = connected ? "" : walletHint();
          var who = savedName();
          walletLine.textContent = connected
            ? (who ? "WELCOME, " + who + "  ·  " : "") + short(w.address) +
              (returned ? "  ·  PROGRESS SAVED" : "")
            : hint;
        }

        // --- character picker ------------------------------------------
        // The full designer (ready-mades + layered builder) lives in
        // src/character-designer.ts and registers window.openCharacterDesigner.
        // This plain script can't import a module, so it calls through that.
        function openPicker() {
          var open = window.openCharacterDesigner;
          if (typeof open === "function") { open(); return; }
          picker.classList.add("open"); // fallback: the old 49-cell grid
          if (grid.childElementCount) return;
          fetch("spritesheets/characters/catalog.json")
            .then(function (r) { return r.json(); })
            .then(function (items) {
              items.forEach(function (item) {
                var cell = document.createElement("div");
                cell.className = "char-cell";
                cell.dataset.id = item.id;
                var i = document.createElement("i");
                i.style.backgroundImage = 'url("' + item.image + '")';
                cell.appendChild(i);
                cell.addEventListener("click", function () {
                  var prev = grid.querySelector(".selected");
                  if (prev) prev.classList.remove("selected");
                  cell.classList.add("selected");
                  selectedId = item.id;
                  confirmBtn.disabled = false;
                });
                grid.appendChild(cell);
              });
            })
            .catch(function () { picker.classList.remove("open"); });
        }

        confirmBtn.addEventListener("click", function () {
          if (!selectedId) return;
          var ids = [selectedId];
          localStorage.setItem("sm-character", JSON.stringify(ids));
          window.dispatchEvent(new CustomEvent("sm:character", { detail: ids }));
          picker.classList.remove("open");
          if (!started) enterWorld();
        });

        // --- entering the world ----------------------------------------
        function enterWorld() {
          if (started) return;
          started = true;
          // NO FULLSCREEN, DELIBERATELY.
          //
          // This used to request it here, because entering the world is the one
          // user gesture that allows it. But a wallet extension's popup is a
          // browser-chrome window, and a fullscreen tab covers it: MetaMask
          // opens behind the game and the player sees a transaction that never
          // arrives. Every interesting thing this game does — minting a box,
          // opening it, a duel wager, claiming rewards — needs that popup, so
          // the game stays in an ordinary tab.
          screen.classList.add("hidden");
          setTimeout(function () { screen.remove(); }, 900);
        }

        // --- wallet connect --------------------------------------------
        async function connect() {
          if (!window.ethereum) { primary.textContent = "NO WALLET FOUND"; return; }
          var previous = primary.textContent;
          try {
            primary.textContent = "CONNECTING\u2026";
            var accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
            var address = accounts[0];
            // Put them on the right chain BEFORE the first signature. Every
            // voucher, wager and claim this game issues is bound to a chain
            // id; signing on the wrong one produces a message that looks
            // valid and lands nowhere.
            if (window.SMChain) {
              primary.textContent = "NETWORK\u2026";
              await window.SMChain.ensure(window.ethereum);
            }
            primary.textContent = "SIGNING\u2026";
            var nonceRes = await fetch("/auth/nonce");
            if (!nonceRes.ok) throw new Error("login service unavailable (" + nonceRes.status + ")");
            var nonce = (await nonceRes.json()).nonce;
            if (!nonce) throw new Error("login service returned no nonce");
            var message = "Stockmonsters login\nAddress: " + address + "\nNonce: " + nonce;
            var signature = await window.ethereum.request({
              method: "personal_sign", params: [message, address]
            });
            var res = await fetch("/auth/verify", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ address: address, message: message, signature: signature })
            });
            if (!res.ok) {
              var why = await res.json().catch(function () { return {}; });
              throw new Error(why.error || ("verification failed (" + res.status + ")"));
            }
            var verified = await res.json();
            localStorage.setItem("sm-wallet", JSON.stringify(verified));
            /*
             * TELL THE GAME. It is already mounted behind this screen.
             *
             * The title screen is an overlay on a game that booted before the
             * player pressed anything, so every module that read the wallet at
             * mount read `null` — and kept it. For a FIRST-TIME player that
             * meant `auth:wallet` was never sent at all: the server never
             * learned who they were, so no profile loaded, no name could be
             * claimed, chat stayed locked, and they were "Trader" forever.
             * Returning players were fine, because their wallet was already in
             * localStorage when the page loaded, which is why this survived.
             */
            window.dispatchEvent(new CustomEvent("sm:wallet", { detail: verified }));
            render();
          } catch (err) {
            primary.textContent = previous;
            // Say what actually happened: a rejected signature, a wallet on
            // the wrong network and a dead login service are three different
            // problems for the player, and only one of them is their doing.
            walletLine.textContent = err && err.smCode
              ? err.message
              : (err && (err.code === 4001 || /user rejected|denied/i.test(err.message || "")))
                ? "Signature rejected."
                : "Login failed: " + ((err && err.message) || "unknown error");
          }
        }

        primary.addEventListener("click", function (e) {
          e.stopPropagation();
          if (!wallet()) { connect(); return; }
          if (!savedCharacter()) { openPicker(); return; } // must pick once
          enterWorld();
        });
        charBtn.addEventListener("click", function (e) {
          e.stopPropagation();
          openPicker();
        });
        // These two enter the world and open the matching in-game window, so
        // there is one place that owns each panel rather than two copies.
        nftBtn.addEventListener("click", function (e) {
          e.stopPropagation();
          enterWorld();
          setTimeout(function () {
            window.dispatchEvent(new CustomEvent("sm:open", { detail: "marketplace" }));
          }, 1000);
        });
        settingsBtn.addEventListener("click", function (e) {
          e.stopPropagation();
          enterWorld();
          setTimeout(function () {
            window.dispatchEvent(new CustomEvent("sm:open", { detail: "settings" }));
          }, 1000);
        });
        // A first-time pick made in the designer should drop straight into
        // the world, the same as the old picker's CONFIRM did.
        window.addEventListener("sm:character", function () {
          if (!started && wallet()) setTimeout(enterWorld, 300);
        });
        // ...and a returning player on a clean device never should have seen
        // the picker: the server knows their character, it just answers a
        // moment after the click.
        window.addEventListener("sm:character-restored", function () {
          if (!started && wallet()) enterWorld();
        });
        // NOTHING ELSE ENTERS THE WORLD. Clicking the artwork used to count as
        // "press start", which meant a click anywhere — the sky, a building,
        // the space beside a button — dropped the player into the game when
        // they were only trying to read the screen or move the pointer. The
        // buttons are the only way in now, and they say what they do.
        //
        // Enter and Space still work, because they are a deliberate press
        // rather than a stray click, but only while the page itself has focus:
        // with a button focused the browser already activates THAT button, and
        // this would otherwise start the game on top of it.
        window.addEventListener("keydown", function (e) {
          if (started || picker.classList.contains("open")) return;
          if (e.key !== "Enter" && e.key !== " ") return;
          var focused = document.activeElement;
          if (focused && focused !== document.body && focused.tagName !== "HTML") return;
          if (!wallet()) return;
          if (!savedCharacter()) { openPicker(); return; }
          enterWorld();
        });

        render();
      })();
    </script>
  </body>
</html>

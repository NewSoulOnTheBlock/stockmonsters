<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Stockmonsters</title>
    <meta
      name="viewport"
      content="initial-scale=1, maximum-scale=1, user-scalable=no, minimum-scale=1, width=device-width, height=device-height"
    />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./node_modules/@rpgjs/ui-css/src/reset.css">
    <link rel="stylesheet" href="./node_modules/@rpgjs/ui-css/src/index.css">
    <link rel="stylesheet" href="./node_modules/@rpgjs/ui-css/theme-pixel/theme.css">
    <style>
      /* Dialogs as centered pixel-art game windows (theme-pixel palette).
         The engine's own container supports positions; we force the centered
         one everywhere and size the box like a classic RPG window. */
      .rpg-ui-dialog-container { align-items: center !important; }
      .rpg-ui-dialog {
        width: min(600px, 92vw) !important;
        min-height: 0 !important;
        --rpg-ui-dialog-min-height: 0px;
        --rpg-ui-dialog-padding: 20px;
        image-rendering: pixelated;
      }
      .rpg-ui-dialog-body { font-size: 15px; line-height: 1.7; }
      .rpg-ui-dialog-content, .rpg-ui-dialog-body { min-height: 0 !important; }
      .rpg-ui-close-button {
        top: 12px !important;
        right: 12px !important;
        left: auto !important;
        width: 34px; height: 34px;
        border-radius: 0 !important;
        border: 3px solid var(--rpg-ui-border) !important;
        background: var(--rpg-ui-surface) !important;
        color: var(--rpg-ui-text) !important;
        box-shadow: 3px 3px 0 #09070f !important;
        font-family: var(--rpg-ui-font) !important;
      }
      body, #rpg {
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        background: #000;
      }
      /* --- Title screen ------------------------------------------------- */
      #title-screen {
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: #000;
        cursor: pointer;
        overflow: hidden;
        transition: opacity .8s ease;
      }
      #title-screen.hidden { opacity: 0; pointer-events: none; }
      #title-screen .art {
        position: absolute;
        inset: 0;
        background: url("/titles/background.png") center / contain no-repeat;
        image-rendering: pixelated;
        animation: kenburns 24s ease-in-out infinite alternate;
      }
      @keyframes kenburns {
        from { transform: scale(1); }
        to   { transform: scale(1.07) translateY(-1.5%); }
      }
      #title-screen .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
      }
      /* The art has "PRESS START" baked in — pulse a glow over the whole
         frame instead of drawing a second button */
      #title-screen .hint {
        position: absolute;
        left: 0; right: 0;
        bottom: 6vh;
        text-align: center;
        font-family: "Fredoka", "Trebuchet MS", sans-serif;
        font-weight: 600;
        letter-spacing: .18em;
        color: #fff;
        text-shadow: 0 2px 0 #1a1a4e, 0 0 18px rgba(80,160,255,.9);
        font-size: clamp(14px, 2.2vw, 22px);
        animation: blink 1.4s steps(2, jump-none) infinite;
        user-select: none;
      }
      @keyframes blink { 50% { opacity: .15; } }
      #title-screen .fade-in {
        position: absolute; inset: 0; background: #000;
        animation: fadein 1.6s ease forwards;
        pointer-events: none;
      }
      @keyframes fadein { to { opacity: 0; } }
    </style>
  </head>
  <body>
    <div id="rpg"></div>
    <div id="title-screen">
      <div class="art"></div>
      <div class="vignette"></div>
      <div class="hint">CLICK OR TAP TO START</div>
      <div class="fade-in"></div>
    </div>
    <script>
      // Classic RPG dialog feel: click the window (or Space/Enter) to
      // advance text. The engine only resolves showText via its close
      // button, so we forward to it — except when the click is a choice.
      document.addEventListener("click", function (e) {
        var dialog = e.target && e.target.closest && e.target.closest(".rpg-ui-dialog");
        if (!dialog) return;
        if (e.target.closest(".rpg-ui-dialog-choice, .rpg-ui-dialog-choices, button")) return;
        var x = document.querySelector(".rpg-ui-close-button");
        if (x) x.click();
      }, true); // capture: the GUI stops propagation on the bubble phase
      window.addEventListener("keydown", function (e) {
        if (e.key !== " " && e.key !== "Enter") return;
        var dialog = document.querySelector(".rpg-ui-dialog");
        if (!dialog || dialog.querySelector(".rpg-ui-dialog-choice")) return;
        var x = document.querySelector(".rpg-ui-close-button");
        if (x) { e.preventDefault(); x.click(); }
      });
      (function () {
        var el = document.getElementById("title-screen");
        var started = false;
        function start() {
          if (started) return;
          started = true;
          // A user gesture is required for fullscreen — this is the one
          if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(function () {});
          }
          el.classList.add("hidden");
          setTimeout(function () { el.remove(); }, 900);
        }
        el.addEventListener("click", start);
        window.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") start();
        });
      })();
    </script>
  </body>
</html>

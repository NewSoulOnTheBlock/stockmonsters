<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Stockmonsters</title>
    <meta
      name="viewport"
      content="initial-scale=1, maximum-scale=1, user-scalable=no, minimum-scale=1, width=device-width, height=device-height"
    />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./node_modules/@rpgjs/ui-css/src/reset.css">
    <link rel="stylesheet" href="./node_modules/@rpgjs/ui-css/src/index.css">
    <link rel="stylesheet" href="./node_modules/@rpgjs/ui-css/theme-pixel/theme.css">
    <style>
      /* Dialogs as centered pixel-art game windows (theme-pixel palette).
         The engine's own container supports positions; we force the centered
         one everywhere and size the box like a classic RPG window. */
      .rpg-ui-dialog-container { align-items: center !important; }
      .rpg-ui-dialog {
        width: min(600px, 92vw) !important;
        min-height: 0 !important;
        --rpg-ui-dialog-min-height: 0px;
        --rpg-ui-dialog-padding: 20px;
        image-rendering: pixelated;
      }
      .rpg-ui-dialog-body { font-size: 15px; line-height: 1.7; }
      .rpg-ui-dialog-content, .rpg-ui-dialog-body { min-height: 0 !important; }
      .rpg-ui-close-button {
        top: 12px !important;
        right: 12px !important;
        left: auto !important;
        width: 34px; height: 34px;
        border-radius: 0 !important;
        border: 3px solid var(--rpg-ui-border) !important;
        background: var(--rpg-ui-surface) !important;
        color: var(--rpg-ui-text) !important;
        box-shadow: 3px 3px 0 #09070f !important;
        font-family: var(--rpg-ui-font) !important;
      }
      body, #rpg {
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        background: #000;
      }
      /* --- Title screen ------------------------------------------------- */
      #title-screen {
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: #000;
        cursor: pointer;
        overflow: hidden;
        transition: opacity .8s ease;
      }
      #title-screen.hidden { opacity: 0; pointer-events: none; }
      #title-screen .art {
        position: absolute;
        inset: 0;
        background: url("/titles/background.png") center / contain no-repeat;
        image-rendering: pixelated;
        animation: kenburns 24s ease-in-out infinite alternate;
      }
      @keyframes kenburns {
        from { transform: scale(1); }
        to   { transform: scale(1.07) translateY(-1.5%); }
      }
      #title-screen .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
      }
      /* The art has "PRESS START" baked in — pulse a glow over the whole
         frame instead of drawing a second button */
      #title-screen .hint {
        position: absolute;
        left: 0; right: 0;
        bottom: 6vh;
        text-align: center;
        font-family: "Fredoka", "Trebuchet MS", sans-serif;
        font-weight: 600;
        letter-spacing: .18em;
        color: #fff;
        text-shadow: 0 2px 0 #1a1a4e, 0 0 18px rgba(80,160,255,.9);
        font-size: clamp(14px, 2.2vw, 22px);
        animation: blink 1.4s steps(2, jump-none) infinite;
        user-select: none;
      }
      @keyframes blink { 50% { opacity: .15; } }
      #title-screen .fade-in {
        position: absolute; inset: 0; background: #000;
        animation: fadein 1.6s ease forwards;
        pointer-events: none;
      }
      @keyframes fadein { to { opacity: 0; } }
      #wallet-btn {
        position: absolute;
        right: 16px; bottom: 16px;
        z-index: 5;
        padding: 10px 14px;
        font-family: "Courier New", ui-monospace, monospace;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: .08em;
        color: #fff1c7;
        background: #26213a;
        border: 3px solid #f6c177;
        border-radius: 0;
        box-shadow: 3px 3px 0 #09070f;
        cursor: pointer;
        image-rendering: pixelated;
      }
      #wallet-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #09070f; }
      #wallet-btn.connected { border-color: #7ecf6b; color: #7ecf6b; }
      #char-btn {
        position: absolute;
        left: 16px; bottom: 16px;
        z-index: 5;
        padding: 10px 14px;
        font-family: "Courier New", ui-monospace, monospace;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: .08em;
        color: #fff1c7;
        background: #26213a;
        border: 3px solid #f6c177;
        border-radius: 0;
        box-shadow: 3px 3px 0 #09070f;
        cursor: pointer;
        image-rendering: pixelated;
      }
      #char-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #09070f; }
      /* --- Create Your Character ---------------------------------------- */
      #char-screen {
        position: fixed;
        inset: 0;
        z-index: 1001;
        background: rgba(9, 7, 15, .88);
        display: none;
        align-items: center;
        justify-content: center;
      }
      #char-screen.open { display: flex; }
      #char-screen .panel {
        width: min(640px, 94vw);
        max-height: 88vh;
        display: flex;
        flex-direction: column;
        background: #26213a;
        border: 4px solid #f6c177;
        box-shadow: 6px 6px 0 #09070f;
        image-rendering: pixelated;
      }
      #char-screen h1 {
        margin: 0;
        padding: 14px 20px;
        font-family: "Fredoka", "Trebuchet MS", sans-serif;
        font-weight: 600;
        letter-spacing: .14em;
        font-size: clamp(15px, 2.4vw, 20px);
        color: #fff1c7;
        text-shadow: 2px 2px 0 #09070f;
        border-bottom: 3px solid #f6c177;
        text-align: center;
      }
      #char-grid {
        flex: 1;
        overflow-y: auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
        gap: 10px;
        padding: 16px;
        scrollbar-width: thin;
      }
      .char-cell {
        position: relative;
        height: 76px;
        background: #1b1730;
        border: 3px solid #4a4368;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .char-cell:hover { border-color: #fff1c7; }
      .char-cell.selected { border-color: #7ecf6b; box-shadow: 0 0 0 1px #7ecf6b inset; }
      /* one 32x32 idle-facing-down frame (col 1, row 0), scaled 2x */
      .char-cell > i {
        width: 32px; height: 32px;
        background-repeat: no-repeat;
        background-position: -32px 0;
        transform: scale(2);
        image-rendering: pixelated;
        pointer-events: none;
      }
      #char-screen .footer {
        display: flex;
        justify-content: center;
        gap: 12px;
        padding: 14px;
        border-top: 3px solid #f6c177;
      }
      #char-confirm {
        padding: 10px 22px;
        font-family: "Courier New", ui-monospace, monospace;
        font-weight: 700;
        font-size: 14px;
        letter-spacing: .08em;
        color: #09070f;
        background: #7ecf6b;
        border: 3px solid #f6c177;
        border-radius: 0;
        box-shadow: 3px 3px 0 #09070f;
        cursor: pointer;
        image-rendering: pixelated;
      }
      #char-confirm:disabled { opacity: .4; cursor: default; }
      #char-confirm:not(:disabled):active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #09070f; }
    </style>
  </head>
  <body>
    <div id="rpg"></div>
    <div id="title-screen">
      <div class="art"></div>
      <div class="vignette"></div>
      <div class="hint">CLICK OR TAP TO START</div>
      <button id="char-btn">CREATE YOUR CHARACTER</button>
      <button id="wallet-btn">CONNECT WALLET</button>
      <div class="fade-in"></div>
    </div>
    <div id="char-screen">
      <div class="panel">
        <h1>CREATE YOUR CHARACTER</h1>
        <div id="char-grid"></div>
        <div class="footer">
          <button id="char-confirm" disabled>CONFIRM</button>
        </div>
      </div>
    </div>
    <script>
      // Classic RPG dialog feel: click the window (or Space/Enter) to
      // advance text. The engine only resolves showText via its close
      // button, so we forward to it — except when the click is a choice.
      document.addEventListener("click", function (e) {
        var dialog = e.target && e.target.closest && e.target.closest(".rpg-ui-dialog");
        if (!dialog) return;
        if (e.target.closest(".rpg-ui-dialog-choice, .rpg-ui-dialog-choices, button")) return;
        var x = document.querySelector(".rpg-ui-close-button");
        if (x) x.click();
      }, true); // capture: the GUI stops propagation on the bubble phase
      window.addEventListener("keydown", function (e) {
        if (e.key !== " " && e.key !== "Enter") return;
        var dialog = document.querySelector(".rpg-ui-dialog");
        if (!dialog || dialog.querySelector(".rpg-ui-dialog-choice")) return;
        var x = document.querySelector(".rpg-ui-close-button");
        if (x) { e.preventDefault(); x.click(); }
      });
      // Wallet login: the server issues a nonce, the wallet signs it, and the
      // server hands back an opaque connectionId derived from the address with
      // a secret it alone holds (see auth.mjs). The client never picks its own
      // identity — otherwise typing someone else's address would load their
      // save. Reconnecting later reuses the stored connectionId.
      (function () {
        var btn = document.getElementById("wallet-btn");
        function short(a) { return a.slice(0, 6) + "…" + a.slice(-4); }
        try {
          var saved = JSON.parse(localStorage.getItem("sm-wallet") || "null");
          if (saved && saved.address && saved.connectionId) {
            btn.textContent = short(saved.address);
            btn.classList.add("connected");
          }
        } catch (e) {}
        btn.addEventListener("click", async function (e) {
          e.stopPropagation(); // don't start the game
          if (!window.ethereum) { btn.textContent = "NO WALLET FOUND"; return; }
          var original = btn.textContent;
          try {
            btn.textContent = "SIGNING…";
            var accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
            var address = accounts[0];
            var nonce = (await (await fetch("/auth/nonce")).json()).nonce;
            var message =
              "Stockmonsters login\nAddress: " + address + "\nNonce: " + nonce;
            var signature = await window.ethereum.request({
              method: "personal_sign", params: [message, address]
            });
            var verify = await fetch("/auth/verify", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ address: address, message: message, signature: signature })
            });
            if (!verify.ok) throw new Error("verification failed");
            var proof = await verify.json();
            localStorage.setItem("sm-wallet", JSON.stringify(proof));
            btn.textContent = short(proof.address);
            btn.classList.add("connected");
            // the identity only takes effect on the next boot
            setTimeout(function () { location.reload(); }, 400);
          } catch (err) {
            btn.textContent = original === "SIGNING…" ? "CONNECT WALLET" : original;
          }
        });
      })();
      // Title curtain + "Create Your Character". A first-time player (or a
      // click on the CREATE YOUR CHARACTER button) gets the picker between
      // the title and the game; returning players skip straight in — their
      // look is restored from localStorage and, authoritatively, from the
      // server's per-wallet save.
      (function () {
        var el = document.getElementById("title-screen");
        var screen = document.getElementById("char-screen");
        var grid = document.getElementById("char-grid");
        var confirmBtn = document.getElementById("char-confirm");
        var started = false;
        var selectedId = null;

        function savedCharacter() {
          try {
            var ids = JSON.parse(localStorage.getItem("sm-character") || "null");
            if (!Array.isArray(ids) || !ids.length) return null;
            var ok = ids.every(function (id) {
              return typeof id === "string" &&
                (id === "hero" || id === "female" || id.indexOf("ch-") === 0);
            });
            return ok ? ids : null;
          } catch (e) { return null; }
        }

        function openPicker() {
          screen.classList.add("open");
          if (grid.childElementCount) return;
          fetch("spritesheets/characters/catalog.json")
            .then(function (r) { return r.json(); })
            .then(function (items) {
              items.forEach(function (item) {
                var cell = document.createElement("div");
                cell.className = "char-cell";
                cell.dataset.id = item.id;
                var i = document.createElement("i");
                i.style.backgroundImage = 'url("' + item.image + '")';
                cell.appendChild(i);
                cell.addEventListener("click", function () {
                  var prev = grid.querySelector(".selected");
                  if (prev) prev.classList.remove("selected");
                  cell.classList.add("selected");
                  selectedId = item.id;
                  confirmBtn.disabled = false;
                });
                grid.appendChild(cell);
              });
            })
            .catch(function () { screen.classList.remove("open"); });
        }

        confirmBtn.addEventListener("click", function () {
          if (!selectedId) return;
          var ids = [selectedId];
          localStorage.setItem("sm-character", JSON.stringify(ids));
          window.dispatchEvent(new CustomEvent("sm:character", { detail: ids }));
          screen.classList.remove("open");
        });

        function start(forcePicker) {
          if (!started) {
            started = true;
            // A user gesture is required for fullscreen — this is the one
            if (document.documentElement.requestFullscreen) {
              document.documentElement.requestFullscreen().catch(function () {});
            }
            el.classList.add("hidden");
            setTimeout(function () { el.remove(); }, 900);
          }
          if (forcePicker || !savedCharacter()) openPicker();
        }
        el.addEventListener("click", function () { start(false); });
        window.addEventListener("keydown", function (e) {
          if (screen.classList.contains("open")) return; // picker owns keys
          if (e.key === "Enter" || e.key === " ") start(false);
        });
        document.getElementById("char-btn").addEventListener("click", function (e) {
          e.stopPropagation(); // don't let the curtain's click handler double-fire
          start(true);
        });
      })();
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stockmonsters</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  #game { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; }
  #netplay { position: fixed; left: 12px; bottom: 12px; z-index: 50; width: min(360px, calc(100vw - 24px));
             font: 13px/1.35 system-ui, sans-serif; color: #e6edf3; pointer-events: none; }
  #netplay .np-status { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; margin-bottom: 6px;
             background: rgba(13,17,23,.75); border-radius: 999px; }
  #netplay .np-dot { width: 8px; height: 8px; border-radius: 50%; background: #d29922; }
  #netplay .np-dot[data-state="ok"] { background: #3fb950; }
  #netplay .np-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 6px; }
  #netplay .np-bar .np-status { margin-bottom: 0; }
  #netplay .np-wallet { padding: 3px 8px; border-radius: 999px; background: rgba(13,17,23,.75);
             font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; color: #8b949e; }
  #netplay .np-wallet:empty, #netplay .np-logout[hidden] { display: none; }
  #netplay .np-logout { pointer-events: auto; padding: 3px 8px; border-radius: 999px; border: 1px solid #30363d; cursor: pointer;
             background: rgba(13,17,23,.75); color: #8b949e; font: 12px/1.35 system-ui, sans-serif; }
  #netplay .np-logout:hover { color: #e6edf3; border-color: #3fb950; }
  #netplay .np-nft { pointer-events: auto; padding: 3px 10px; border-radius: 999px; border: 1px solid #2ea043; cursor: pointer;
             background: #238636; color: #fff; font: 600 12px/1.35 system-ui, sans-serif; }
  #netplay .np-nft[hidden] { display: none; }
  #netplay .np-log { max-height: 140px; overflow-y: auto; padding: 4px 8px; background: rgba(13,17,23,.6); border-radius: 6px 6px 0 0;
             text-shadow: 0 1px 1px #000; }
  #netplay .np-log:empty { display: none; }
  #netplay .np-line b { color: #3fb950; }
  #netplay .np-input { pointer-events: auto; width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #30363d;
             border-radius: 6px; background: rgba(13,17,23,.85); color: inherit; font: inherit; }
  #np-tags { position: fixed; inset: 0; z-index: 40; pointer-events: none; }
  .np-tag { position: absolute; left: 0; top: 0; padding: 1px 6px; border-radius: 4px; white-space: nowrap;
            font: 600 12px/1.3 system-ui, sans-serif; color: #fff; background: rgba(13,17,23,.7); }
  #np-trade, .np-panel { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 60;
              width: min(380px, calc(100vw - 32px)); box-sizing: border-box; padding: 14px 16px; border-radius: 10px;
              font: 14px/1.4 system-ui, sans-serif; color: #e6edf3; background: rgba(13,17,23,.94); border: 1px solid #30363d; }
  #np-trade h3, .np-panel h3 { margin: 0 0 10px; font-size: 16px; }
  #np-trade p, .np-panel p { margin: 6px 0; }
  #np-trade .np-muted, .np-panel .np-muted { color: #8b949e; }
  #np-trade .np-party { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  #np-trade .np-row, .np-panel .np-row { display: flex; gap: 8px; margin-top: 10px; }
  #np-trade button, .np-panel button { flex: 1; padding: 8px 10px; border-radius: 6px; border: 1px solid #30363d; cursor: pointer;
                     font: inherit; color: inherit; background: #21262d; text-align: left; }
  #np-trade .np-row button, .np-panel .np-row button { text-align: center; }
  #np-trade button.picked, .np-panel button.picked { border-color: #3fb950; background: #12261a; }
  #np-trade button.primary, .np-panel button.primary { background: #238636; border-color: #2ea043; }
  #np-trade button:disabled, .np-panel button:disabled { opacity: .45; cursor: default; }
</style>
</head>
<body>
<div id="game"></div>
<script>
  // Where the game server lives (login, multiplayer, trades, battles, NFTs).
  // Locally (play.ps1) and on stockmonsters.app the server itself hosts this page: same origin.
  window.STOCKMONSTERS_SERVER = /^(localhost|127\.0\.0\.1|\[::1\]|(www\.)?stockmonsters\.app)$/.test(location.hostname)
    ? "" : "https://stockmonsters-server.onrender.com";
  EJS_player = "#game";
  EJS_core = "gba";
  EJS_gameName = "Stockmonsters";
  EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
  EJS_startOnLoaded = true;
  EJS_color = "#3fb950";
  EJS_backgroundColor = "#000000";

  // Nothing loads until login.js has a session; each wallet gets its own save slot.
  window.bootStockmonsters = (wallet) => {
  if (window.bootStockmonsters.done) return;
  window.bootStockmonsters.done = true;
  EJS_gameName = "Stockmonsters-" + wallet;

  // EmulatorJS caches ROMs in IndexedDB by URL, and every build is exactly
  // 16 MB, so key the URL on the build's timestamp or players get a stale ROM
  // that no longer matches netplay.js. Saves are named without the query.
  (async () => {
    let build = "";
    try {
      const head = await fetch("stockmonsters.gba", { method: "HEAD", cache: "no-store" });
      build = Date.parse(head.headers.get("Last-Modified")) || "";
    } catch {}
    EJS_gameUrl = "stockmonsters.gba" + (build ? "?build=" + build : "");
    const s = document.createElement("script");
    s.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
    document.body.appendChild(s);
  })();
  };
</script>
<script src="login.js"></script>
<script src="netplay.js"></script>
</body>
</html>

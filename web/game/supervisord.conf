; Mounted/copied to /etc/neko/supervisord/stockmonsters.conf
; neko's base image starts X + PulseAudio + the WebRTC gateway; these two
; programs add the window manager and the game itself on top.

[program:openbox]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/openbox --config-file /etc/neko/openbox.xml
autorestart=true
priority=300
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/openbox.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true

[program:stockmonsters]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s",PSDK_BINARY_PATH="/opt/psdk/",LD_LIBRARY_PATH="/opt/psdk/ruby-dist/lib",LIBGL_ALWAYS_SOFTWARE="1",GALLIUM_DRIVER="llvmpipe",MESA_GL_VERSION_OVERRIDE="3.3",GAME_SCALE="%(ENV_GAME_SCALE)s",GAME_LANG="%(ENV_GAME_LANG)s"
command=/usr/local/bin/launch-game
directory=/opt/game
stopsignal=TERM
stopasgroup=true
killasgroup=true
autorestart=true
startretries=999
priority=800
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/stockmonsters.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true
